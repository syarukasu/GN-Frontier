name: Verify and build core
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check shared version
        run: python tools/verify_repository.py
      - name: Fetch checksum-locked upstream build dependencies
        run: python tools/project.py deps
      - name: Compile and reobfuscate the one core mod
        working-directory: addon
        run: bash gradlew --no-daemon --max-workers=2 jar
      - name: Check built version and embedded originals
        run: python tools/project.py check --jar "addon/build/libs/gn-frontier-$(cat VERSION).jar"
      - name: Verify dedicated-server compatibility against the pinned original
        working-directory: addon
        run: bash gradlew --no-daemon --max-workers=2 verifyServerCompatibility
      - name: Verify weapon repair amounts and boundaries
        working-directory: addon
        run: bash gradlew --no-daemon --max-workers=2 verifyWeaponRepair
      - name: Build JAR-free client and server distributions
        run: python tools/build_release.py
      - name: Verify package coverage and archive contents
        run: python tools/test_distribution.py --release "dist/GN-Frontier-$(cat VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: gn-frontier-core
          path: addon/build/libs/gn-frontier-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gn-frontier-distributions
          path: |
            dist/GN-Frontier-*/*.zip
            dist/GN-Frontier-*/*.mrpack
            dist/GN-Frontier-*/downloads.lock.json
            dist/GN-Frontier-*/SHA256SUMS.txt
          if-no-files-found: error
